name: Personal Linux libmpv
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build cmake pkg-config gcc g++ curl unzip libgtk-3-dev libepoxy-dev \
            libavcodec-dev libavfilter-dev libavformat-dev libavutil-dev \
            libswresample-dev libswscale-dev libass-dev libplacebo-dev \
            libegl1-mesa-dev libgl-dev libva-dev libvdpau-dev libdrm-dev \
            libgbm-dev libx11-dev libxrandr-dev libxpresent-dev libxss-dev \
            libpulse-dev libasound2-dev libwayland-dev wayland-protocols libxkbcommon-dev
      - name: Build from the pinned personal source
        run: bash libs/linux/media_kit_libs_linux/linux/build-mpv.sh "$PWD/build/native-linux"
      - name: Verify client ABI and shared dependencies
        run: |
          ldd build/native-linux/libmpv.so.2 | tee build/native-linux/ldd.txt
          ! grep -q 'not found' build/native-linux/ldd.txt
          python3 - <<'PY'
          import ctypes
          lib = ctypes.CDLL('./build/native-linux/libmpv.so.2')
          lib.mpv_client_api_version.restype = ctypes.c_ulong
          assert lib.mpv_client_api_version() >> 16 == 2
          lib.mpv_create.restype = ctypes.c_void_p
          ctx = lib.mpv_create()
          assert ctx
          lib.mpv_destroy.argtypes = [ctypes.c_void_p]
          lib.mpv_destroy(ctx)
          PY
      - name: Compile and verify the actual Linux video plugin
        run: |
          curl --fail --location --retry 3 --max-time 180 \
            https://storage.googleapis.com/flutter_infra_release/flutter/692136cb6582dbfc5af3fb33c2515a069f2f66d0/linux-x64-debug/linux-x64-flutter-gtk.zip \
            -o build/flutter-engine.zip
          echo '2a522fd7d5c12a54165f1e48001fcb331649a24a21083510fe6734699346d7e2  build/flutter-engine.zip' | sha256sum -c -
          unzip -q build/flutter-engine.zip -d build/flutter-engine
          mkdir -p build/linux-plugin-smoke
          ln -s "$PWD/build/native-linux" build/linux-plugin-smoke/media_kit_mpv
          cmake -S native/linux-plugin-smoke -B build/linux-plugin-smoke -G Ninja \
            -DFLUTTER_ENGINE_SDK="$PWD/build/flutter-engine" -DCMAKE_BUILD_TYPE=Release
          cmake --build build/linux-plugin-smoke -j 4
          cmake --install build/linux-plugin-smoke --prefix "$PWD/build/plugin-bundle"
          plugin=build/plugin-bundle/lib/libmedia_kit_video_plugin.so
          readelf -d "$plugin" | tee build/native-linux/plugin-dynamic.txt
          grep -F '$ORIGIN' build/native-linux/plugin-dynamic.txt
          LD_LIBRARY_PATH="$PWD/build/flutter-engine" ldd "$plugin" | tee build/native-linux/plugin-ldd.txt
          ! grep -q 'not found' build/native-linux/plugin-ldd.txt
          grep -F "$PWD/build/plugin-bundle/lib/libmpv.so.2" build/native-linux/plugin-ldd.txt
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x64-libmpv
          path: |
            build/native-linux/libmpv.so.2
            build/native-linux/SOURCE.json
            build/native-linux/ldd.txt
            build/native-linux/LICENSE.LGPL
            build/native-linux/Copyright
            build/native-linux/plugin-dynamic.txt
            build/native-linux/plugin-ldd.txt
